<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO Meta Tags -->
  <title>Atualizar Meus Dados | Stop Clean Lava-Jato</title>
  <meta name="description" content="Mantenha suas informações pessoais e de contato atualizadas na Stop Clean Lava-Jato para garantir o melhor atendimento e ofertas exclusivas."/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="canonical" href="https://stopclean.com.br/meus-dados"/>

  <!-- Open Graph / Redes Sociais -->
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Atualizar Dados | Stop Clean Lava-Jato"/>
  <meta property="og:description" content="Gerencie suas informações de perfil na Stop Clean Lava-Jato."/>

  <!-- Ícones Tabler e Folhas de Estilo -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="atualizar_cliente.css"/>
  <link rel="stylesheet" href="common.css">
</head>
<body id="page-atualizar-cliente">

  <!-- Cabeçalho -->
  <header class="sc-topbar">
    <a href="index.html" class="sc-logo" title="Stop Clean Lava-Jato - Home">
      <div class="sc-logo-circle">
        <div class="sc-flag"><span></span><span></span><span></span><span></span></div>
        <div class="sc-flag"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="sc-logo-text">Stop Clean<small>Lava Rápido</small></div>
    </a>
  </header>

  <!-- Conteúdo Principal -->
  <main class="sc-main">
    <div class="sc-form-wrap">
      <div class="sc-card">

        <!-- Cabeçalho do Card -->
        <header class="sc-card-header">
          <span class="sc-badge"><i class="ti ti-user-check" aria-hidden="true"></i> MEU PERFIL</span>
          <h1>ATUALIZAR <span>DADOS</span></h1>
          <p>Mantenha suas informações de contato e segurança atualizadas</p>
        </header>

        <!-- Formulário de Edição -->
        <form id="formAtualizar" novalidate onsubmit="salvarDadosCliente(event)">

          <!-- Nome -->
          <div class="sc-field">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Ex.: Carlos Eduardo Silva" autocomplete="name" required/>
          </div>

          <!-- CPF + Telefone -->
          <div class="sc-field-row">
            <div class="sc-field">
              <label for="cpf">CPF (Somente leitura)</label>
              <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" readonly disabled/>
            </div>
            <div class="sc-field">
              <label for="telefone">Telefone / WhatsApp</label>
              <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" maxlength="15" autocomplete="tel" required/>
            </div>
          </div>

          <!-- E-mail -->
          <div class="sc-field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required/>
          </div>

          <hr class="sc-divider"/>

          <!-- Nova Senha (Opcional) -->
          <div class="sc-field">
            <label for="senha">Nova Senha (deixe em branco para não alterar)</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
            <div class="sc-pw-strength" id="pwBars">
              <div class="sc-pw-bar" id="bar1"></div>
              <div class="sc-pw-bar" id="bar2"></div>
              <div class="sc-pw-bar" id="bar3"></div>
            </div>
            <div class="sc-pw-label" id="pwLabel"></div>
          </div>

          <!-- Confirmar Nova Senha -->
          <div class="sc-field">
            <label for="confirmar">Confirmar Nova Senha</label>
            <input type="password" id="confirmar" name="confirmar" placeholder="Repita a nova senha" autocomplete="new-password"/>
          </div>

          <!-- Ações -->
          <div class="form-actions">
            <button type="button" class="sc-btn sc-btn-outline" onclick="window.location.href='index.html#perfil'">Cancelar</button>
            <button type="submit" id="saveBtn" class="sc-btn sc-btn-yellow sc-submit">Salvar Alterações</button>
          </div>

        </form>

      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="sc-footer">
    <p>© 2025 Stop Clean Lava Rápido · (11) 97124-5742</p>
    <nav aria-label="Links de privacidade no rodapé">
      <a href="#privacidade">Política de Privacidade</a>
    </nav>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/atualizar_cliente.js"></script>
<script src="js/common.js"></script>
  <script src="js/input-masks.js"></script>
</body>
</html>
