<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <!-- SEO Primary Tags -->
  <title>Stop Clean Lava Rápido | Criar Minha Conta</title>
  <meta name="title" content="Stop Clean Lava Rápido | Criar Minha Conta"/>
  <meta name="description" content="Cadastre-se na Stop Clean Lava Rápido e tenha acesso a promoções exclusivas, histórico de serviços e acompanhamento do programa de fidelidade."/>
  <meta name="keywords" content="cadastro stop clean, criar conta lava rápido, cadastro estética automotiva, agendamento de lavagem"/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://stopclean.com.br/cadastro.html"/>

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://stopclean.com.br/cadastro.html"/>
  <meta property="og:title" content="Stop Clean Lava Rápido | Cadastro de Cliente"/>
  <meta property="og:description" content="Crie sua conta para acessar ofertas e gerenciar as lavagens do seu veículo."/>
  <meta property="og:image" content="https://stopclean.com.br/assets/og-image.jpg"/>

  <!-- Fontes Externa -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap"/>

  <!-- CSS Externo -->
  <link rel="stylesheet" href="./cadastro.css"/>
  <link rel="stylesheet" href="common.css">
</head>
<body>

  <!-- Topbar -->
  <header class="sc-topbar">
    <a href="./apresentacao.html" class="sc-logo" title="Stop Clean Lava Rápido - Página Inicial">
      <div class="sc-logo-circle">
        <div class="sc-flag"><span></span><span></span><span></span><span></span></div>
        <div class="sc-flag"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="sc-logo-text">
        Stop Clean
        <small>Lava Rápido</small>
      </div>
    </a>

  </header>

  <!-- Conteúdo Principal -->
  <main class="sc-main">
    <div class="sc-form-wrap">
      <div class="sc-card">

        <!-- Header do Cartão -->
        <header class="sc-card-header">
          <span class="sc-badge">&#10003;&nbsp; Grátis</span>
          <h1>CRIE SUA CONTA</h1>
          <p>Acesse promoções exclusivas e histórico de serviços</p>
        </header>

        <!-- Formulário de Cadastro -->
        <form id="formCadastro" novalidate>

          <!-- Nome -->
          <div class="sc-field">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Ex.: Carlos Eduardo Silva" autocomplete="name" required>
          </div>

          <!-- CPF + Telefone -->
          <div class="sc-field-row">
            <div class="sc-field">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="off" required>
            </div>
            <div class="sc-field">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" maxlength="15" autocomplete="tel" required>
            </div>
          </div>

          <!-- E-mail -->
          <div class="sc-field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>

          <hr class="sc-divider">

          <!-- Senha -->
          <div class="sc-field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
            <div class="sc-pw-strength" id="pwBars">
              <div class="sc-pw-bar" id="bar1"></div>
              <div class="sc-pw-bar" id="bar2"></div>
              <div class="sc-pw-bar" id="bar3"></div>
            </div>
            <div class="sc-pw-label" id="pwLabel"></div>
          </div>

          <!-- Confirmar senha -->
          <div class="sc-field">
            <label for="confirmar">Confirmar Senha</label>
            <input type="password" id="confirmar" name="confirmar" placeholder="Repita sua senha" autocomplete="new-password" required>
          </div>

          <!-- Submit -->
          <button type="submit" class="sc-btn sc-btn-primary sc-submit">Criar minha conta</button>

        </form>

      </div>

      <!-- Link para Login -->
      <p class="sc-login-link">
        Já tenho conta &rarr; <a href="./login.html">Entrar</a>
      </p>

    </div>
  </main>

  <!-- Rodapé -->
  <footer class="sc-footer">
    <p>Stop Clean Lava Rápido &middot; (11) 97124-5742</p>
    <a href="#privacidade">Política de Privacidade</a>
  </footer>

  <!-- Importação dos scripts -->
  <script src="js/api.js"></script>
  <script src="js/cadastro.js"></script>
<script src="js/common.js"></script>
  <script src="js/input-masks.js"></script>
</body>
</html>
